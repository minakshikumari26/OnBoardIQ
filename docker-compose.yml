services:

  postgres:
    image: postgres:15-alpine
    container_name: onboardiq-db
    environment:
      POSTGRES_DB:       loan_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: "0921"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onboardiq-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:      postgres
      DB_NAME:      loan_db
      DB_USER:      postgres
      DB_PASSWORD:  "0921"
      DB_PORT:      "5432"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: onboardiq-ui
    depends_on:
      - backend
    environment:
      # Streamlit hits the backend service via the docker network
      API_URL: "http://backend:8000"
    ports:
      - "8501:8501"

volumes:
  pgdata:
